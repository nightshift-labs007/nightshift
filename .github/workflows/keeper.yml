name: keeper
# Manual backup only. The keeper (/api/keeper, every 10 minutes) and the hourly X post (/api/x/post?slot=hourly, on
# the hour) are scheduled on cron-job.org, which fires on time; GitHub's scheduler skipped runs for hours at a time.
# Run this by hand (Actions → keeper → Run workflow) if cron-job.org is ever down. Market posts live in x-agent.yml.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Also post the hourly X post"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the keeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -m 90 -H "Authorization: Bearer $CRON_SECRET" https://nightshift.buzz/api/keeper)
          head -c 1500 out.json; echo
          test "$code" = "200"
      - name: Post the hourly X post
        if: always() && github.event.inputs.post == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o x.json -w "%{http_code}" -m 90 -H "Authorization: Bearer $CRON_SECRET" "https://nightshift.buzz/api/x/post?slot=hourly")
          cat x.json; echo
          test "$code" = "200"
