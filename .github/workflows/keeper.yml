name: keeper
# Pushes Oracle prices on-chain and runs the Guardian by calling the site's keeper job.
# Every 30 minutes keeps a private repo inside GitHub's free Actions minutes; for a 5-minute cadence use
# cron-job.org (free) with the same "Authorization: Bearer <CRON_SECRET>" header.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the keeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -m 90 -H "Authorization: Bearer $CRON_SECRET" https://nightshift.buzz/api/keeper)
          head -c 1500 out.json; echo
          test "$code" = "200"
