name: keeper
# Every 20 minutes: pushes Oracle prices on-chain, runs the Guardian, and posts the X agent's theorem of the moment
# (one job for both, so each run costs one Actions minute). The fixed-time market posts live in x-agent.yml.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the keeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -m 90 -H "Authorization: Bearer $CRON_SECRET" https://nightshift.buzz/api/keeper)
          head -c 1500 out.json; echo
          test "$code" = "200"
      - name: Post the theorem to X
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o x.json -w "%{http_code}" -m 90 -H "Authorization: Bearer $CRON_SECRET" "https://nightshift.buzz/api/x/post?slot=theorem")
          cat x.json; echo
          test "$code" = "200"
