<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Nightshift mark, "Night Watch": a crescent moon whose dark side holds a watching eye (the Oracle at night) -->
  <defs>
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="41" cy="25" r="20" fill="#000"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="25" fill="#c4ecd9" mask="url(#crescent)"/>
  <circle cx="41" cy="25" r="9.5" stroke="#c4ecd9" stroke-width="2.5"/>
  <circle cx="41" cy="25" r="4.2" fill="#ff963e"/>
</svg>
